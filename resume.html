<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV | Cameron Persaud</title>
  <meta name="description" content="Cameron Persaud's curriculum vitae.">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="_ds/nocturne-ec39c827-87c5-4fe1-bb59-b2793aa207f2/styles.css">
  <link rel="stylesheet" href="assets/site.css">
  <script src="_ds/nocturne-ec39c827-87c5-4fe1-bb59-b2793aa207f2/_ds_bundle.js"></script>
</helmet>

<dc-import name="NavBar" active-page="resume" hint-size="100%,90px"></dc-import>

<main id="main" class="wrap">
  <header class="page-head">
    <h1>CV</h1>
    <p class="lead">Three pages, last updated {{cvUpdated}}.</p>
    <div class="button-row">
      <a class="button" href="assets/Cameron_Persaud_CV.pdf" download="Cameron_Persaud_CV.pdf">Download PDF</a>
      <a class="button quiet" href="assets/Cameron_Persaud_CV.pdf" target="_blank" rel="noopener">Open in a new tab</a>
    </div>
  </header>

  <!-- Larger screens: the PDF itself. -->
  <div class="pdf-frame">
    <iframe src="assets/Cameron_Persaud_CV.pdf#view=FitH" title="Cameron Persaud CV (PDF)"></iframe>
  </div>
  <p class="pdf-fallback">If the PDF doesn&rsquo;t show above, <a href="assets/Cameron_Persaud_CV.pdf">open it directly</a>.</p>

  <!-- Phones: phone browsers won't show a PDF inside a page, so each page is shown as an image instead. -->
  <div class="cv-pages">
    <sc-for list="{{cvPages}}" as="pg" hint-placeholder-count="3">
      <a href="assets/Cameron_Persaud_CV.pdf" class="cv-page">
        <img src="{{pg.src}}" alt="{{pg.alt}}" width="1200" height="1553" loading="lazy" />
      </a>
    </sc-for>
    <p class="pdf-fallback">Tap a page to open the PDF.</p>
  </div>
</main>

<dc-import name="Footer" hint-size="100%,120px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    // When you replace assets/Cameron_Persaud_CV.pdf, update the date below and
    // the page images in assets/cv-pages/ (one image per PDF page, 1200px wide).
    const pageCount = 3;
    const cvPages = Array.from({ length: pageCount }, (_, i) => ({
      src: `assets/cv-pages/page-${i + 1}.webp`,
      alt: `CV page ${i + 1} of ${pageCount}`,
    }));
    return { cvUpdated: 'October 2026', cvPages };
  }
}
</script>
</body>
</html>
